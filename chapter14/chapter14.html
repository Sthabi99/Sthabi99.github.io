<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Order Calculator</title>
    <link rel="stylesheet" href="chapter14.css">
</head>

<body>
    <a href="../index.html">Back to portfolio</a>
    <h1>Pizzeria Order Calculator</h1>
    <p>A practice calculator, not a real ordering service. Example prices: $10 per pizza, $12 for supreme, and $5 delivery. Delivery is free on birthdays or for orders over $10 in Anytown.</p>

    <div id="orderForm">
        <label>How many pizzas do you want?
            <input type="number" id="numPizzas" min="1" max="100" step="1" value="1" />
        </label>
        <br />
        <br />
        <label>What kind of pizzas?
            <select id="typePizza" value="cheese">
                <option value="cheese">Cheese</option>
                <option value="pepperoni">Pepperoni</option>
                <option value="supreme">Supreme</option>
            </select>
        </label>
        <br />
        <br />
        <label>Where do you live?
            <select id="deliveryCity" value="Anytown">
                <option value="Anytown">Anytown</option>
                <option value="Sacramento">Sacramento</option>
                <option value="Vaal">Vaal</option>
            </select>
        </label>
        <br />
        <br />
        <label>Is it your Birthday?
            <select id="birthday" value="no">
                <option value="yes">Yes</option>
                <option value="no" selected>No</option>
            </select>
        </label>
        <br />
        <br />

        <button type="button" id="placeOrder">Calculate total</button>
    </div>
    <div id="displayTotal" role="status" aria-live="polite"></div>
    <script src="chapter14.js"></script>
</body>

</html>
