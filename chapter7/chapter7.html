<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive CSS Robot</title>
    <link rel="stylesheet" href="chapter7.css">

</head>
<body>
    <div id="robot">
        <div id="head">
            <div class="eye" id="righteye"></div>
            <div class="eye" id="lefteye"></div>
            <div id="nose"></div>
            <div id="mouth"></div>
        </div>
        <div class="arm" id="rightarm"></div>
        <div id="body"><p>I &lt;3 JS!</p></div>
        <div class="arm" id="leftarm" role="button" tabindex="0"
             aria-label="Raise or lower the robot's left arm by 90 degrees"
             aria-pressed="false" title="Click to raise or lower the arm by 90 degrees"></div>
        </div>
<script src="chapter7.js"></script>
</body>
</html>
